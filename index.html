<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b59ff">
  <title>课程复习刷题 AI 助教</title>
  <meta name="description" content="面向课程复习场景的对话式助教，支持考点梳理、习题生成、错题解析、知识点对比与错题本。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="侧边栏">
      <div class="brand">
        <div class="brand-mark">刷</div>
        <div class="brand-text">
          <strong>课程复习<br>刷题 AI 助教</strong>
          <span>Course Review Assistant</span>
        </div>
      </div>

      <section class="side-block">
        <p class="intro-text">把课件、笔记和错题放进来，整理成能直接背的考点、能直接做的题。</p>
        <div class="pill-row">
          <span class="pill">考点</span>
          <span class="pill">习题</span>
          <span class="pill">错题</span>
        </div>
      </section>

      <section class="side-block">
        <h3 class="side-title">能帮你做什么</h3>
        <ul class="cap-list">
          <li data-action="open-knowledge" role="button" tabindex="0"><span>考点梳理</span><em>分级大纲</em></li>
          <li><span>习题生成</span><em>题目 + 解析</em></li>
          <li><span>错题解析</span><em>逐项拆解</em></li>
          <li><span>知识点对比</span><em>对比表格</em></li>
        </ul>
      </section>

      <div class="side-footer">
        <button type="button" class="btn btn--ghost btn--block history-trigger" id="historyBtn">
          <span>历史对话</span>
          <em class="history-count" id="historyCount">0</em>
        </button>
        <button type="button" class="btn btn--ghost btn--block" id="clearBtn">清空对话</button>
        <p class="note">历史对话保存在本机浏览器，可随时查看或删除。</p>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <button type="button" class="icon-btn mobile-only" id="menuBtn" aria-label="打开侧边栏">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="head-title">
          <h1>课程复习刷题 AI 助教</h1>
          <p>选一门课，从考点到错题，一次复习完</p>
        </div>
        <div class="head-actions">
          <button type="button" class="btn btn--ghost btn--sm wrongbook-trigger" id="wrongbookBtn">
            <span>错题本</span>
            <em class="history-count" id="wrongbookCount">0</em>
          </button>
          <button type="button" class="btn btn--ghost btn--sm" id="exportBtn">导出</button>
          <button type="button" class="btn btn--ghost btn--sm" id="clearBtnTop">清空对话</button>
        </div>
      </header>

      <section class="messages" id="messageList" aria-live="polite"></section>

      <footer class="composer">
        <div class="context-bar" id="contextBar" hidden></div>
        <div class="chips" id="chipBar">
          <button type="button" class="chip" data-action="open-knowledge">选择知识点</button>
          <button type="button" class="chip" data-action="empty-quiz">生成练习题</button>
          <button type="button" class="chip" data-action="empty-wrong">解析错题</button>
          <button type="button" class="chip" data-action="empty-compare">知识点对比</button>
        </div>

        <div class="input-shell">
          <textarea id="input" rows="1" maxlength="1000" aria-label="复习提问输入框" placeholder="例如：帮我整理第 4 章考点 / 出 5 道栈和队列的题 / 这道题为什么选 B"></textarea>
          <div class="input-bar">
            <span class="kbd-hint">Enter 发送 · Shift + Enter 换行</span>
            <span class="counter"><span id="counter">0</span>/1000</span>
            <button type="button" class="btn btn--send" id="sendBtn">
              <span>发送</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">复习资料仅供参考，考试范围以老师要求为准。</p>
      </footer>
    </main>
  </div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="history-modal" id="historyModal" aria-hidden="true">
    <div class="history-card" role="dialog" aria-modal="true" aria-label="历史对话">
      <div class="history-head">
        <h2>历史对话</h2>
        <button type="button" class="icon-btn history-close" id="closeHistoryBtn" aria-label="关闭历史对话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="history-foot">
        <button type="button" class="btn btn--ghost" id="newChatBtn">开始新对话</button>
      </div>
    </div>
  </div>

  <div class="wrongbook-modal" id="wrongbookModal" aria-hidden="true">
    <div class="wrongbook-card" role="dialog" aria-modal="true" aria-label="错题本">
      <div class="history-head">
        <h2>错题本</h2>
        <div class="wrongbook-head-actions">
          <button type="button" class="btn btn--ghost btn--sm" id="clearWrongbookBtn">清空</button>
          <button type="button" class="icon-btn history-close" id="closeWrongbookBtn" aria-label="关闭错题本">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div class="wrongbook-list" id="wrongbookList"></div>
    </div>
  </div>

  <div class="knowledge-modal" id="knowledgeModal" aria-hidden="true">
    <div class="knowledge-card" role="dialog" aria-modal="true" aria-label="知识库">
      <div class="history-head">
        <h2 id="knowledgeTitle">知识库</h2>
        <div class="wrongbook-head-actions">
          <button type="button" class="btn btn--ghost btn--sm" id="addKnowledgeBtn">添加知识点</button>
          <button type="button" class="icon-btn history-close" id="closeKnowledgeBtn" aria-label="关闭知识库">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div class="knowledge-body" id="knowledgeBody"></div>
    </div>
  </div>

  <script src="assets/data/questions.js"></script>
  <script src="assets/data/knowledge.js"></script>
  <script src="assets/js/knowledge-templates.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/agent.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
